{% set name = "hypothesize" %}
{% set version = "1.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hypothesize-{{ version }}.tar.gz
  sha256: 3f6d73e87de826669ef5ca783cfa2d3f79b8ac76ab176303c59730ec7c107a5b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - more-itertools ==8.12.0
    - numpy ==1.21.5
    - pandas ==1.4.2
    - python >={{ python_min }}
    - scipy ==1.7.3

test:
  imports:
    - hypothesize
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Alcampopiano/hypothesize
  summary: A Python package for comparing groups and measuring associations using robust statistics.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
