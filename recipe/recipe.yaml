schema_version: 1

context:
  name: hypothesize
  version: "1.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hypothesize-${{ version }}.tar.gz
  sha256: 77c7bf8cc12fab226511d24bdcad96882ab5372e21a3d393fb954316f7db9ca1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - more-itertools >=8.12.0
    - numpy >=1.22.0
    - pandas >=1.4.2
    - python >=${{ python_min }}
    - scipy >=1.10.0

tests:
  - python:
      imports:
        - hypothesize
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A Python package for comparing groups and measuring associations using robust statistics.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/Alcampopiano/hypothesize

extra:
  recipe-maintainers:
    - jan-janssen
